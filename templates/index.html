<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurAI Code - OWASP Security Auditor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950 py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-shield-halved text-emerald-400 text-2xl"></i>
            <span class="text-xl font-bold tracking-wide bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">SecurAI Code</span>
        </div>
        <div class="flex items-center space-x-2 text-xs bg-slate-800 px-3 py-1.5 rounded-full text-slate-300 border border-slate-700">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Gemini 2.5 Flash Active</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6 p-6 max-w-[1600px] w-full mx-auto">
        
        <!-- Left Column: Code Input -->
        <section class="bg-slate-800/50 border border-slate-700 rounded-xl p-5 flex flex-col shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-code text-cyan-400"></i> Source Code Input
                </h2>
                <select id="languageSelect" class="bg-slate-900 border border-slate-700 text-sm text-slate-300 rounded-lg px-3 py-1.5 focus:outline-none focus:border-emerald-500">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                </select>
            </div>

            <textarea id="codeInput" class="w-full flex-1 bg-slate-950 border border-slate-800 text-slate-200 font-mono text-sm p-4 rounded-lg focus:outline-none focus:border-emerald-500 resize-none min-h-[350px]" placeholder="Paste code snippet here for OWASP vulnerability audit..."></textarea>

            <button id="auditBtn" onclick="runAudit()" class="mt-4 w-full bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-600 hover:to-cyan-600 text-slate-950 font-bold py-3 rounded-lg transition duration-200 flex justify-center items-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> Run Security Audit
            </button>
        </section>

        <!-- Right Column: Audit Report -->
        <section class="bg-slate-800/50 border border-slate-700 rounded-xl p-5 flex flex-col shadow-xl overflow-y-auto max-h-[80vh]">
            <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie text-emerald-400"></i> Audit Report
            </h2>

            <!-- Placeholder Before Audit -->
            <div id="placeholderState" class="flex-1 flex flex-col items-center justify-center text-slate-400 py-12">
                <i class="fa-solid fa-bug text-5xl mb-3 text-slate-600"></i>
                <p>Paste code on the left and click "Run Security Audit"</p>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingState" class="hidden flex-1 flex flex-col items-center justify-center text-emerald-400 py-12 space-y-3">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl"></i>
                <p class="text-slate-300 text-sm">Analyzing OWASP vulnerabilities & generating secure fix...</p>
            </div>

            <!-- Report Results -->
            <div id="reportContent" class="hidden space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-lg">
                        <span class="text-xs text-slate-400 uppercase tracking-wider">Security Score</span>
                        <div id="scoreVal" class="text-3xl font-extrabold mt-1 text-emerald-400">0/100</div>
                    </div>
                    <div class="bg-slate-950 border border-slate-800 p-4 rounded-lg">
                        <span class="text-xs text-slate-400 uppercase tracking-wider">Risk Level</span>
                        <div id="riskVal" class="text-3xl font-extrabold mt-1 text-rose-400">Low</div>
                    </div>
                </div>

                <div class="bg-slate-950 border border-slate-800 p-4 rounded-lg">
                    <h3 class="text-sm font-semibold text-slate-300 mb-1">Executive Summary</h3>
                    <p id="summaryVal" class="text-sm text-slate-400 leading-relaxed"></p>
                </div>

                <div>
                    <h3 class="text-sm font-semibold text-slate-300 mb-2">Detected Vulnerabilities</h3>
                    <div id="vulnList" class="space-y-3"></div>
                </div>

                <div>
                    <h3 class="text-sm font-semibold text-slate-300 mb-2">Remediated Code</h3>
                    <pre class="bg-slate-950 border border-slate-800 p-4 rounded-lg font-mono text-xs text-emerald-300 overflow-x-auto"><code id="fixedCodeVal"></code></pre>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
