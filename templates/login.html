<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SecurAI Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold text-emerald-400 mb-6 text-center">Login to SecurAI</h2>
        <form action="/api/v1/auth/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Email Address</label>
                <input type="email" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Password</label>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-600 hover:to-cyan-600 text-slate-950 font-bold py-3 rounded-lg transition duration-200 mt-2">
                Login
            </button>
        </form>
        <p class="text-xs text-slate-400 text-center mt-6">
            Account nahi hai? <a href="/signup" class="text-emerald-400 hover:underline">Sign up karein</a>
        </p>
    </div>
</body>
</html>
